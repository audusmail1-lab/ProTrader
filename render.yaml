# Render.com blueprint — one-click deploy from a GitHub repo.
#
#   1. push this folder to GitHub
#   2. render.com → New → Blueprint → pick the repo
#   3. Render reads this file, builds the Dockerfile, gives you an https URL
#
# Paid always-on hosting approved September 17, 2026: Starter $7/month.
# Keep this in sync with the Render service compute plan.
services:
  - type: web
    name: protrader
    runtime: docker
    plan: starter         # $7/month, always-on (owner approved)
    region: frankfurt     # pick the region nearest your users
    healthCheckPath: /api/health
    # Durable state — accounts, sessions, Telegram pairings, notification
    # watcher, Sentinel journal — lives under /var/data. Without this disk every
    # deploy starts empty. SQLite files stay small (tens of MB after years), so
    # 5 GB is years of headroom at $0.25/GB/month. A disk can be grown later,
    # never shrunk. If the service already has a disk, give it this name (or
    # put that disk's name here) — a service can only have one.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 5
    domains:
      - app.protraderacademy.company
    autoDeploy: true      # every git push redeploys
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
